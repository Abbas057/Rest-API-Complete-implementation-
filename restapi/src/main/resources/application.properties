spring.application.name=product-service

management.tracing.sampling.probability=1.0

spring.datasource.url=jdbc:h2:mem:productdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.jpa.show-sql=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{X-Correlation-ID}] %logger{36} - %msg%n

#retry
resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=5s

#circuit breaker
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2
resilience4j.timelimiter.instances.inventory.timeout-duration=2s

#bulkHead
resilience4j.bulkhead.instances.inventory.max-concurrent-calls=3
resilience4j.bulkhead.instances.inventory.max-wait-duration=0

#rateLimiter
resilience4j.ratelimiter.instances.inventory.limit-for-period=5
resilience4j.ratelimiter.instances.inventory.limit-refresh-period=1s
resilience4j.ratelimiter.instances.inventory.timeout-duration=0

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

